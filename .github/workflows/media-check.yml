name: media-check
# Teste depuis internet un échantillon d'extraits audio et de pochettes du catalogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/check-media.mjs, .github/workflows/media-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-media.mjs
      - name: Commit media-check.json
        run: |
          git config user.name "pompelup-bot"
          git config user.email "pompelup-bot@users.noreply.github.com"
          git add media-check.json
          git commit -m "chore: vérification des extraits et pochettes" || exit 0
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
