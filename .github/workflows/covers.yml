name: covers
# Construit covers.js (vraies pochettes) côté serveur : pas de CORS ni de limite navigateur.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [songs.js, scripts/fetch-covers.mjs, .github/workflows/covers.yml]
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency: covers
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-covers.mjs
      - name: Commit covers.js
        run: |
          git add covers.js previews.js
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "pompelup-bot"
          git config user.email "pompelup-bot@users.noreply.github.com"
          git commit -m "chore: pochettes et extraits audio mis à jour"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
