name: covers
# Construit covers.js (vraies pochettes) côté serveur : pas de CORS ni de limite navigateur.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [songs.js, scripts/fetch-covers.mjs, .github/workflows/covers.yml]
permissions:
  contents: write
concurrency: covers
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-covers.mjs
      - name: Commit covers.js
        run: |
          if git diff --quiet covers.js; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "pompelup-bot"
          git config user.email "pompelup-bot@users.noreply.github.com"
          git add covers.js
          git commit -m "chore: pochettes d'album mises à jour"
          git pull --rebase origin main
          git push origin HEAD:main
